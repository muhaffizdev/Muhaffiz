<svg xmlns="http://www.w3.org/2000/svg" width="886" height="572" viewBox="0 0 886 572"><rect width="886" height="572" fill="#ffffff"/><rect x="22" y="8" width="266" height="516" rx="26" fill="#1c2a33"/><rect x="30" y="16" width="250" height="500" rx="19" fill="#ffffff"/><rect x="30" y="16" width="250" height="20" rx="0" fill="#f1f4f5"/><text x="46.0" y="29.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#333">9:41</text><text x="260.0" y="28.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="end" font-weight="normal" fill="#333">●●●  T2</text><rect x="30" y="36" width="250" height="40" rx="0" fill="#0F5C63"/><text x="64.0" y="60.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#fff">←  Settings and consent</text><rect x="42" y="90" width="226" height="40" rx="8" fill="#f7f9fa" stroke="#e0e6e8" stroke-width="1"/><text x="54.0" y="113.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Microphone detection</text><rect x="226" y="102" width="34" height="17" rx="9" fill="#0F5C63"/><circle cx="251" cy="110.5" r="7" fill="#fff"/><rect x="42" y="136" width="226" height="40" rx="8" fill="#f7f9fa" stroke="#e0e6e8" stroke-width="1"/><text x="54.0" y="159.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Voice activation</text><rect x="226" y="148" width="34" height="17" rx="9" fill="#0F5C63"/><circle cx="251" cy="156.5" r="7" fill="#fff"/><rect x="42" y="182" width="226" height="40" rx="8" fill="#f7f9fa" stroke="#e0e6e8" stroke-width="1"/><text x="54.0" y="205.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Location sharing</text><rect x="226" y="194" width="34" height="17" rx="9" fill="#0F5C63"/><circle cx="251" cy="202.5" r="7" fill="#fff"/><rect x="42" y="228" width="226" height="40" rx="8" fill="#f7f9fa" stroke="#e0e6e8" stroke-width="1"/><text x="54.0" y="251.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Silent as default SOS</text><rect x="226" y="240" width="34" height="17" rx="9" fill="#b0bec5"/><circle cx="235" cy="248.5" r="7" fill="#fff"/><rect x="42" y="274" width="226" height="40" rx="8" fill="#f7f9fa" stroke="#e0e6e8" stroke-width="1"/><text x="54.0" y="297.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Decoy Mode</text><rect x="226" y="286" width="34" height="17" rx="9" fill="#b0bec5"/><circle cx="235" cy="294.5" r="7" fill="#fff"/><rect x="42" y="320" width="226" height="40" rx="8" fill="#f7f9fa" stroke="#e0e6e8" stroke-width="1"/><text x="54.0" y="343.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">Alert nearby helpers</text><rect x="226" y="332" width="34" height="17" rx="9" fill="#0F5C63"/><circle cx="251" cy="340.5" r="7" fill="#fff"/><rect x="42" y="372" width="226" height="44" rx="8" fill="#F4F8F8" stroke="#cfd8dc" stroke-width="1"/><text x="52.0" y="387.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Evidence retention</text><text x="52.0" y="402.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">30 days (7, 30 or 90)</text><text x="155.0" y="443.1" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" font-weight="normal" fill="#555">Each switch works on its own and takes effect at once.</text><text x="155.0" y="548.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#10262B">Settings and consent toggles</text><rect x="310" y="8" width="266" height="516" rx="26" fill="#1c2a33"/><rect x="318" y="16" width="250" height="500" rx="19" fill="#ffffff"/><rect x="318" y="16" width="250" height="20" rx="0" fill="#f1f4f5"/><text x="334.0" y="29.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#333">9:41</text><text x="548.0" y="28.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="end" font-weight="normal" fill="#333">●●●  T2</text><rect x="318" y="36" width="250" height="40" rx="0" fill="#0F5C63"/><text x="352.0" y="60.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#fff">←  Privacy summary</text><rect x="330" y="88" width="226" height="100" rx="8" fill="#F4F8F8" stroke="#cfd8dc" stroke-width="1"/><text x="340.0" y="103.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">On our servers</text><text x="340.0" y="118.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Profile, trustees, circles, shared</text><text x="340.0" y="133.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"> locations, reports, helper status</text><text x="340.0" y="148.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"></text><rect x="330" y="198" width="226" height="100" rx="8" fill="#CDEDE4" stroke="#cfd8dc" stroke-width="1"/><text x="340.0" y="213.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Only on your phone</text><text x="340.0" y="228.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Audio buffers, evidence recordings</text><text x="340.0" y="243.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">, library, models, event log</text><text x="340.0" y="258.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"></text><rect x="330" y="308" width="226" height="100" rx="8" fill="#F4F8F8" stroke="#cfd8dc" stroke-width="1"/><text x="340.0" y="323.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Sent during an SOS</text><text x="340.0" y="338.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Location and message to your trust</text><text x="340.0" y="353.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">ees, helpers and authority numbers</text><text x="340.0" y="368.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"></text><text x="443.0" y="439.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#222">No audio from detection or voice ever leaves the phone.</text><text x="443.0" y="548.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#10262B">Privacy summary</text><rect x="598" y="8" width="266" height="516" rx="26" fill="#1c2a33"/><rect x="606" y="16" width="250" height="500" rx="19" fill="#ffffff"/><rect x="606" y="16" width="250" height="20" rx="0" fill="#f1f4f5"/><text x="622.0" y="29.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#333">9:41</text><text x="836.0" y="28.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="end" font-weight="normal" fill="#333">●●●  T2</text><rect x="606" y="36" width="250" height="40" rx="0" fill="#0F5C63"/><text x="620.0" y="60.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#fff">Before you start</text><text x="620.0" y="103.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">Microphone: the app listens for distress sounds and</text><text x="620.0" y="127.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">your safe phrases. This happens only on your phone.</text><text x="620.0" y="151.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">No audio is stored by these features.</text><text x="620.0" y="175.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">Location: shared only as you choose.</text><text x="620.0" y="199.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">Evidence: audio is recorded only after an SOS</text><text x="620.0" y="223.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">starts, and stays on your phone.</text><rect x="620" y="266" width="18" height="18" rx="3" fill="#fff" stroke="#0F5C63" stroke-width="1"/><text x="646.0" y="278.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">I understand and agree</text><rect x="620" y="316" width="222" height="40" rx="10" fill="#0F5C63"/><text x="731.0" y="339.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#fff">Accept and continue</text><rect x="620" y="364" width="222" height="36" rx="10" fill="#eceff1"/><text x="731.0" y="385.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#333">Not now (features stay off)</text><text x="731.0" y="548.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#10262B">Onboarding consent</text></svg>