or="start" font-weight="normal" fill="#222">blue lantern tonight</text><rect x="330" y="128" width="226" height="40" rx="8" fill="#CDEDE4" stroke="#cfd8dc" stroke-width="1"/><text x="340.0" y="143.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Samples 3 of 3 recognised</text><text x="340.0" y="158.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Sensitivity set</text><rect x="330" y="184" width="226" height="32" rx="6" fill="#fff" stroke="#90a4ae" stroke-width="1"/><text x="338.0" y="196.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="start" font-weight="normal" fill="#607d8b">Duress phrase (silent SOS)</text><text x="338.0" y="210.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" font-weight="normal" fill="#222">the kettle is ready</text><rect x="330" y="224" width="226" height="40" rx="8" fill="#F4F8F8" stroke="#cfd8dc" stroke-width="1"/><text x="340.0" y="239.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Samples 2 of 3 recognised</text><text x="340.0" y="254.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Say it once more</text><rect x="330" y="284" width="226" height="40" rx="10" fill="#0F5C63"/><text x="443.0" y="307.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#fff">Record sample</text><text x="443.0" y="351.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#555">Phrases are 2 to 5 words and must be different.</text><text x="443.0" y="548.4" font-family="Liberation Sans, Arial, Helvetica, 