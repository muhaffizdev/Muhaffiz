<svg xmlns="http://www.w3.org/2000/svg" width="598" height="572" viewBox="0 0 598 572"><rect width="598" height="572" fill="#ffffff"/><rect x="22" y="8" width="266" height="516" rx="26" fill="#1c2a33"/><rect x="30" y="16" width="250" height="500" rx="19" fill="#ffffff"/><rect x="30" y="16" width="250" height="20" rx="0" fill="#f1f4f5"/><text x="46.0" y="29.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#333">9:41</text><text x="260.0" y="28.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="end" font-weight="normal" fill="#333">●●●  T2</text><rect x="30" y="36" width="250" height="40" rx="0" fill="#0F5C63"/><text x="64.0" y="60.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#fff">←  Privacy summary</text><rect x="42" y="88" width="226" height="100" rx="8" fill="#F4F8F8" stroke="#cfd8dc" stroke-width="1"/><text x="52.0" y="103.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">On our servers</text><text x="52.0" y="118.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Profile, trustees, circles, shared</text><text x="52.0" y="133.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"> locations, reports, helper status</text><text x="52.0" y="148.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"></text><rect x="42" y="198" width="226" height="100" rx="8" fill="#CDEDE4" stroke="#cfd8dc" stroke-width="1"/><text x="52.0" y="213.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Only on your phone</text><text x="52.0" y="228.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Audio buffers, evidence recordings</text><text x="52.0" y="243.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">, library, models, event log</text><text x="52.0" y="258.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"></text><rect x="42" y="308" width="226" height="100" rx="8" fill="#F4F8F8" stroke="#cfd8dc" stroke-width="1"/><text x="52.0" y="323.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#222">Sent during an SOS</text><text x="52.0" y="338.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">Location and message to your trust</text><text x="52.0" y="353.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222">ees, helpers and authority numbers</text><text x="52.0" y="368.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#222"></text><text x="155.0" y="439.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#222">No audio from detection or voice ever leaves the phone.</text><text x="155.0" y="548.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#10262B">Privacy summary</text><rect x="310" y="8" width="266" height="516" rx="26" fill="#1c2a33"/><rect x="318" y="16" width="250" height="500" rx="19" fill="#ffffff"/><rect x="318" y="16" width="250" height="20" rx="0" fill="#f1f4f5"/><text x="334.0" y="29.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="bold" fill="#333">9:41</text><text x="548.0" y="28.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="8.5" text-anchor="end" font-weight="normal" fill="#333">●●●  T2</text><rect x="318" y="36" width="250" height="40" rx="0" fill="#0F5C63"/><text x="332.0" y="60.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="start" font-weight="bold" fill="#fff">Before you start</text><text x="332.0" y="103.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">Microphone: the app listens for distress sounds and</text><text x="332.0" y="127.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">your safe phrases. This happens only on your phone.</text><text x="332.0" y="151.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">No audio is stored by these features.</text><text x="332.0" y="175.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">Location: shared only as you choose.</text><text x="332.0" y="199.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">Evidence: audio is recorded only after an SOS</text><text x="332.0" y="223.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222">starts, and stays on your phone.</text><rect x="332" y="266" width="18" height="18" rx="3" fill="#fff" stroke="#0F5C63" stroke-width="1"/><text x="358.0" y="278.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#222">I understand and agree</text><rect x="332" y="316" width="222" height="40" rx="10" fill="#0F5C63"/><text x="443.0" y="339.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#fff">Accept and continue</text><rect x="332" y="364" width="222" height="36" rx="10" fill="#eceff1"/><text x="443.0" y="385.9" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#333">Not now (features stay off)</text><text x="443.0" y="548.4" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#10262B">Onboarding consent</text></svg>